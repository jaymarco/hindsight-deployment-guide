# Hindsight WebUI Apache httpd 反代配置
# ⚠️ 占位符需替换为实际值

# 监听端口（避开 Chrome 黑名单 10080，使用 8081）
Listen 8081

<VirtualHost *:8081>
    ServerName {{PROD_HOST_IP}}

    # Basic Auth
    <Location />
        AuthType Basic
        AuthName "Hindsight WebUI"
        AuthUserFile /etc/httpd/conf.d/.htpasswd
        Require valid-user
    </Location>

    # 反代到 Hindsight 容器（直连容器 IP，绕开 docker-proxy 死锁）
    ProxyPass / http://{{HINDSIGHT_CONTAINER_IP}}:9999/ retry=0
    ProxyPassReverse / http://{{HINDSIGHT_CONTAINER_IP}}:9999/

    # 关闭代理超时
    ProxyTimeout 600

    # 日志
    ErrorLog /var/log/httpd/hindsight-error.log
    CustomLog /var/log/httpd/hindsight-access.log combined
</VirtualHost>
